name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: PhoneBox version
      description: The settings page shows it next to its title (the agent and the phone app should match).
      placeholder: "0.9.6"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer
      placeholder: "Windows 11 24H2 / Ubuntu 24.04 / macOS 15 (Apple silicon)"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 4a, Android 13"
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [USB, Wi-Fi, Tailscale, Not connected yet]
  - type: textarea
    id: log
    attributes:
      label: Agent log
      description: >-
        The end of agent.log: %LOCALAPPDATA%\PhoneBox (Windows), ~/.local/share/PhoneBox (Linux),
        ~/Library/Application Support/PhoneBox (macOS). Remove anything private first (keys, tokens, calendar URLs,
        names of your files or sessions).
      render: text
